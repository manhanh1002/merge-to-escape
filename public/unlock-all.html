<!doctype html>
<!--
  Test helper: unlocks all 100 levels in this browser's local save, keeping gold, stars,
  talents, best records and any level in progress. Open http://localhost:3123/unlock-all.html
  once. (Same keys/format as lib/save.ts: v2 save; an old v1 save is unlocked in place and
  the game migrates it to v2 on the next load.)
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unlock all levels — Merge to Escape</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12122a; color: #f1e6c8; font: 16px/1.5 Georgia, serif; }
    .card { max-width: 420px; padding: 28px 32px; border: 1px solid #a8792a; border-radius: 14px; background: #1c1b33; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
    h1 { margin: 0 0 8px; font-size: 24px; color: #e2b55a; }
    p { margin: 6px 0; color: #c9bfdc; }
    a { display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 10px; background: linear-gradient(180deg, #ffe7a0, #e2b55a 55%, #a8792a); color: #2a1a05; font-weight: 700; text-decoration: none; }
    .err { color: #ff8a96; }
  </style>
</head>
<body>
  <div class="card">
    <h1>All levels unlocked</h1>
    <p id="status">Updating your save…</p>
    <a href="/">Back to the game →</a>
  </div>
  <script>
    const KEY = 'merge-to-escape:save:v2'
    const LEGACY_KEY = 'merge-to-escape:save:v1'
    const LAST_LEVEL_INDEX = 99 // 100 levels
    const status = document.getElementById('status')
    const read = (key) => { try { return JSON.parse(localStorage.getItem(key)) } catch (e) { return null } }
    try {
      let key = KEY
      let save = read(KEY)
      if (!save || save.version !== 2) {
        const legacy = read(LEGACY_KEY)
        if (legacy && legacy.version === 1) { key = LEGACY_KEY; save = legacy }
        else save = { version: 2, unlocked: 0, current: 0, gold: 0, records: {}, stars: 0, talents: {}, stash: {}, settings: { sound: true } }
      }
      save.unlocked = LAST_LEVEL_INDEX
      localStorage.setItem(key, JSON.stringify(save))
      status.textContent = 'All 100 levels can now be picked from the level menu. Your gold (' + (save.gold || 0) + '), stars (' + (save.stars || 0) + ') and records were kept.'
      setTimeout(() => { location.href = '/' }, 2500)
    } catch (e) {
      status.className = 'err'
      status.textContent = 'Could not write the save (is local storage blocked?): ' + e.message
    }
  </script>
</body>
</html>
